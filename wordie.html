<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeyxowordie</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f3b;--panel:#262b52;--ink:#f2efff;--mute:#9aa0d0;--yellow:#ffd23f;--coral:#ff5d73;--teal:#2ec4b6;--abs:#3a4070}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 14px 18px;max-width:480px;margin:0 auto}
h1{font-size:30px;font-weight:700;padding:18px 0 4px}
p{color:var(--mute);font-size:14px;line-height:1.4}
.hidden{display:none}
.back{background:none;border:0;color:var(--mute);font:inherit;font-size:15px;padding:12px 0;cursor:pointer}
.panel{background:var(--panel);border-radius:18px;padding:16px;margin:14px 0}
.stats{display:flex;gap:18px;font-size:13px;color:var(--mute)}
.stats b{color:var(--ink);font-size:18px;display:block}
.btn{display:block;width:100%;text-align:left;border:0;color:var(--ink);font:inherit;background:var(--panel);border-radius:18px;padding:16px;margin-bottom:12px;border-left:6px solid var(--c);cursor:pointer}
.btn h2{font-size:20px;margin-bottom:4px}
.btn:disabled{opacity:.5;cursor:default}
#board{display:grid;gap:6px;margin:10px auto 14px;width:min(100%,320px)}
.r{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{aspect-ratio:1;border:2px solid var(--abs);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;text-transform:uppercase}
.t.f{border-color:var(--mute)}
.correct{background:var(--teal);border-color:var(--teal);color:#10243a}
.present{background:var(--yellow);border-color:var(--yellow);color:#10243a}
.absent{background:var(--abs);border-color:var(--abs);color:var(--mute)}
#kb{display:grid;gap:6px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;min-width:0;height:46px;border:0;border-radius:8px;background:#343a6c;color:var(--ink);font:inherit;font-weight:600;font-size:15px;text-transform:uppercase;cursor:pointer}
.k.w{flex:1.6;font-size:12px}
#toast{min-height:22px;text-align:center;font-weight:600;color:var(--yellow)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<main id="menu">
  <a class="back" href="index.html" style="text-decoration:none;display:inline-block">← Triple Play</a>
  <h1>Zeyxowordie</h1>
  <p>Guess the 5-letter word in six tries.</p>
  <section class="panel"><div class="stats"><div><b id="sp">0</b>Played</div><div><b id="sw">0%</b>Wins</div><div><b id="ss">0</b>Streak</div><div><b id="sb">0</b>Best</div></div></section>
  <button class="btn" id="bd" style="--c:var(--yellow)" onclick="start('daily')"><h2>Daily word</h2><p id="dnote">Same word for everyone today.</p></button>
  <button class="btn" style="--c:var(--teal)" onclick="start('random')"><h2>Random word</h2><p>Play as much as you like.</p></button>
</main>

<main id="game" class="hidden">
  <button class="back" onclick="toMenu()">← Back</button>
  <div id="toast" role="status"></div>
  <div id="board"></div>
  <div id="result" class="panel hidden"><p id="rmsg" style="color:var(--ink);font-size:16px;margin-bottom:12px"></p><button class="btn" style="--c:var(--coral);margin:0 0 8px" onclick="share()">Share result</button><button class="btn" style="--c:var(--teal);margin:0" onclick="toMenu()">Back to menu</button></div>
  <div id="kb"></div>
</main>

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
const KEY = "tp_wordie_v1", PK = "tp_profile_v1";

function dailyWord(){
  let h = 0; for (const c of today()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return ANSWERS[h % ANSWERS.length];
}
function score(g, a){
  const r = Array(5).fill("absent"), rem = {};
  for (let i = 0; i < 5; i++) { if (g[i] === a[i]) r[i] = "correct"; else rem[a[i]] = (rem[a[i]] || 0) + 1; }
  for (let i = 0; i < 5; i++) { if (r[i] === "correct") continue; if (rem[g[i]] > 0) { r[i] = "present"; rem[g[i]]--; } }
  return r;
}
function menu(){
  $("sp").textContent = S.played;
  $("sw").textContent = (S.played ? Math.round(100 * S.wins / S.played) : 0) + "%";

}

  $("menu").classList.toggle("hidden", id !== "menu"); $("game").classList.toggle("hidden", id !== "game");

}
function toMenu(){ menu(); show("menu"); }

function start(m){

  const b = $("board"); b.innerHTML = "";

      const k = document.createElement("button"); k.className = "k"; k.id = "k" + c;
      if (c === "+") { k.textContent = "Enter"; k.classList.add("w"); k.onclick = () => key("Enter"); }
      else if (c === "-") { k.textContent = "⌫"; k.classList.add("w"); k.onclick = () => key("Backspace"); }
      else { k.textContent = c; k.onclick = () => key(c); }
      r.appendChild(k);
    }
    kb.appendChild(r);
  });

}
const tile = (r, c) => $("board").children[r].children[c];

function key(k){
  if (over) return;
  if (k === "Enter") return submit();
  if (k === "Backspace") { if (col > 0) { col--; cur.pop(); const t = tile(row, col); t.textContent = ""; t.classList.remove("f"); } return; }

}
document.addEventListener("keydown", e => { if ($("game").classList.contains("hidden") || e.ctrlKey || e.metaKey) return; key(e.key.length === 1 ? e.key.toLowerCase() : e.key); });

function submit(){
  if (col < 5) return toast("Not enough letters");

  if (!VALID.has(w)) return toast("Not in the word list");
  if (guesses.includes(w)) return toast("You already tried that word");
  toast("");
  const r = score(w, answer), rank = {absent:0, present:1, correct:2};

    if (!(w[i] in ks) || rank[s] > rank[ks[w[i]]]) ks[w[i]] = s;
  });

    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  } else msg = "Out of guesses. The word was " + answer.toUpperCase() + ".";
  $("rmsg").textContent = msg; $("result").classList.remove("hidden");
}
function share(){
  const em = {correct:"🟩", present:"🟨", absent:"⬛"};
  const t = "Zeyxowordie " + (mode === "daily" ? "Daily " : "") + (guesses[guesses.length - 1] === answer ? guesses.length : "X") + "/6\n" + rows.map(r => r.map(s => em[s]).join("")).join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Copied. Paste it in a chat."), () => toast("Could not copy"));
}
menu();
</script>
